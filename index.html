<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeo Exclusivo - Engenheiro</title>
    
    <!-- Open Graph para Redes Sociais -->
    <meta property="og:title" content="Transmissão Exclusiva em Vídeo">
    <meta property="og:description" content="Clique para assistir ao conteúdo completo em alta definição.">
    <meta property="og:image" content="https://img.youtube.com/vi/CDdvxI_enVU/hqdefault.jpg">
    <meta property="og:type" content="website">

    <style>
        :root {
            --bg-color: #000000;
            --gold-color: #D4AF37;
            --card-bg: #0f0f0f;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--gold-color);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 2px solid var(--gold-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
        }
        h1 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gold-color);
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 177.77%; /* Proporção 9:16 otimizada para Shorts */
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--gold-color);
            margin-bottom: 20px;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .btn {
            display: inline-block;
            background-color: var(--gold-color);
            color: #000000;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
        }
        .btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Transmissão Exclusiva</h1>
    
    <div class="video-wrapper">
        <iframe src="https://www.youtube.com/embed/CDdvxI_enVU" title="YouTube Short" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>

    <p style="font-size: 0.85rem; color: var(--gold-color); margin-bottom: 15px; opacity: 0.8;">Assista ao conteúdo completo acima.</p>
    
    <a href="https://youtube.com/shorts/CDdvxI_enVU?is=bL6UjDOmOA_VpoOb" class="btn" target="_blank">Assistir no YouTube</a>
</div>

</body>
</html>
